# Personnalisations locales du CRS (OWASP Core Rule Set), chargées avant crs-setup.conf et les
# règles CRS elles-mêmes (voir /etc/modsecurity.d/setup.conf sur l'image owasp/modsecurity-crs :
# modsecurity-override.conf est inclus juste après modsecurity.conf).
#
# assista-crise est une API REST (Django REST Framework) qui utilise PATCH/PUT/DELETE sur de
# nombreux endpoints métier (modifier une équipe, un utilisateur, un point opérationnel...) —
# le défaut CRS (règle 900200 dans crs-setup.conf, non actif par défaut) ne laisse passer que
# GET/HEAD/POST/OPTIONS (voir REQUEST-901-INITIALIZATION.conf). Sans cette règle, activer le
# blocage (SecRuleEngine On) casserait toute mise à jour/suppression via l'API — vérifié en
# direct sur les logs d'audit (DetectionOnly) : des PATCH légitimes sur /api/teams/, /api/users/,
# /api/points-operationnels/ déclenchaient la règle 911100 "Method is not allowed by policy".
SecAction \
    "id:900200,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS PUT PATCH DELETE'"

# /o/authorize/ (SSO Matrix, voir core/oidc.py) reçoit un paramètre redirect_uri qui pointe vers
# le service MAS sur son adresse LAN (ex: http://172.16.1.114:8086/upstream/callback/...) --
# la règle CRS 931100 "Possible RFI Attack: URL Parameter using IP Address" bloque tout
# redirect_uri contenant une IP littérale, un faux positif ici (constaté avec Sylvain le
# 24/09 : la vraie connexion échouait en 403 sans autre message). Désactivée seulement sur ce
# chemin précis, le reste du site garde la protection RFI complète.
SecRule REQUEST_URI "@beginsWith /o/authorize" \
    "id:900201,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveById=931100"

# Sous-domaines Matrix (matrix./auth./chat.assista-crise.fr, voir doc de conception
# "Matrix / Element") : le protocole Matrix (payloads JSON riches côté Synapse/sync, MAS
# OAuth) déclenche régulièrement de faux positifs génériques du CRS (ex: règle 930120 "OS
# File Access Attempt" sur le simple nom de paramètre JSON
# json.extensions.org.matrix.msc4262.profiles.enabled, qui contient ".profile" -- constaté
# avec Sylvain le 24/09, bloquait /sync et rendait Element Web inutilisable après chargement
# de la page). Plutôt que d'exclure les règles une par une au fil des faux positifs qui
# continueraient à apparaître, le moteur CRS est désactivé entièrement pour ces 3
# sous-domaines seulement -- Synapse/MAS ont leur propre validation stricte des entrées, ce
# n'est pas une app web classique que le CRS est conçu pour protéger. Le site principal
# (assista-crise.fr) garde la protection CRS complète.
SecRule REQUEST_HEADERS:Host "@rx ^(matrix|auth|chat)\.assista-crise\.fr$" \
    "id:900202,\
    phase:1,\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleEngine=Off"
